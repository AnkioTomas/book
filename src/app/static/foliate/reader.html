<!DOCTYPE html>
<html lang="zh-CN" class="mdui-theme-auto">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob:; script-src 'self'; style-src 'self' blob: 'unsafe-inline'; font-src 'self' blob: data:; img-src 'self' blob: data: https://cdn.weread.qq.com; connect-src 'self' blob: data: *; frame-src blob: data:; object-src blob: data:; form-action 'none';">
    <title>阅读</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png"/>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32x32.png"/>
    <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16x16.png"/>
    <link rel="icon" type="image/ico" href="/static/icons/favicon.ico"/>
    <link rel="stylesheet" href="/static/framework/icons/fonts.css">
    <link rel="stylesheet" href="/static/framework/libs/mdui.css">
    <link rel="stylesheet" href="reader.css">
    <script src="/static/framework/libs/mdui.global.min.js"></script>
</head>
<body>
<input type="file" id="file-input" hidden accept=".epub,.mobi,.azw,.azw3,.pdf,.fb2,.cbz">

<div id="drop-target">
    <div>
        <mdui-icon name="menu_book" class="empty-icon" style="font-size:72px"></mdui-icon>
        <h1>打开一本书</h1>
        <p>拖放到此处，或 <button type="button" id="file-button">选择文件</button></p>
    </div>
</div>

<div id="status" class="status" hidden>
    <div class="status-card">
        <div id="status-loading" class="status-spin" hidden>
            <mdui-circular-progress style="width:28px;height:28px"></mdui-circular-progress>
            <span>正在打开…</span>
        </div>
        <div id="status-error" hidden>
            <p class="status-title">无法打开这本书</p>
            <p class="status-desc" id="status-error-msg">文件可能已损坏，或格式不受支持。</p>
            <mdui-button class="mt-4" href="/index/main/book" variant="filled" style="margin-top:1.5rem">返回书库</mdui-button>
        </div>
    </div>
</div>

<div id="reader-root"></div>
<div id="folio" aria-live="polite"></div>

<div id="toc-scrim" class="scrim" aria-hidden="true"></div>
<aside id="toc-panel" class="side-panel" aria-label="目录" hidden>
    <div class="panel-head">
        <h2>目录</h2>
        <mdui-button-icon icon="close" id="toc-close" aria-label="关闭目录"></mdui-button-icon>
    </div>
    <div class="panel-meta">
        <img id="side-bar-cover" alt="">
        <div class="meta-text">
            <div id="side-bar-title" class="title-small" style="font-weight:600"></div>
            <p id="side-bar-author" class="meta-author"></p>
        </div>
    </div>
    <div class="panel-body" id="toc-view"></div>
</aside>

<aside id="settings-panel" class="side-panel see-through" data-side="end" aria-label="阅读设置" hidden>
    <div class="panel-head">
        <h2>阅读设置</h2>
        <mdui-button-icon icon="close" id="settings-close" aria-label="关闭设置"></mdui-button-icon>
    </div>
    <div class="panel-body" id="settings-body">
        <section class="settings-section">
            <span class="label">主题</span>
            <div class="seg" role="radiogroup" aria-label="主题" data-setting="theme">
                <button type="button" data-value="auto" aria-checked="true">自动</button>
                <button type="button" data-value="light" aria-checked="false">浅色</button>
                <button type="button" data-value="dark" aria-checked="false">深色</button>
            </div>
        </section>
        <section class="settings-section">
            <span class="label">版式</span>
            <div class="seg" role="radiogroup" aria-label="版式" data-setting="flow">
                <button type="button" data-value="paginated" aria-checked="true">分页</button>
                <button type="button" data-value="scrolled" aria-checked="false">滚动</button>
            </div>
        </section>
        <section class="settings-section">
            <span class="label">字体</span>
            <div class="weread-font-status search-status" id="weread-font-status">正在加载字体列表…</div>
            <div class="weread-font-list" role="radiogroup" aria-label="字体" data-setting="typeface" id="weread-font-list"></div>
        </section>
        <section class="settings-section">
            <span class="label">文字</span>
            <div class="settings-row">
                <span class="row-label">字号</span>
                <mdui-slider id="set-font-size" min="14" max="28" step="1" value="18"></mdui-slider>
                <span class="row-value" id="set-font-size-val">18</span>
            </div>
            <div class="settings-row">
                <span class="row-label">行距</span>
                <mdui-slider id="set-line-height" min="1.2" max="2.2" step="0.1" value="1.6"></mdui-slider>
                <span class="row-value" id="set-line-height-val">1.6</span>
            </div>
            <div class="settings-row">
                <span class="row-label">对齐</span>
                <div class="seg" role="radiogroup" aria-label="对齐" data-setting="justify">
                    <button type="button" data-value="false" aria-checked="false">左齐</button>
                    <button type="button" data-value="true" aria-checked="true">两端</button>
                </div>
            </div>
            <div class="settings-row">
                <span class="row-label">断字</span>
                <mdui-switch id="set-hyphenate" checked></mdui-switch>
            </div>
        </section>
        <section class="settings-section">
            <span class="label">进度显示</span>
            <div class="seg" role="radiogroup" aria-label="进度显示" data-setting="progressMode">
                <button type="button" data-value="percent" aria-checked="true">百分比</button>
                <button type="button" data-value="page" aria-checked="false">页码</button>
                <button type="button" data-value="none" aria-checked="false">隐藏</button>
            </div>
        </section>
    </div>
</aside>

<div id="search-scrim" class="scrim" aria-hidden="true"></div>
<aside id="search-panel" class="side-panel" data-side="end" aria-label="书内搜索" hidden>
    <div class="panel-head">
        <h2>搜索</h2>
        <mdui-button-icon icon="close" id="search-close" aria-label="关闭搜索"></mdui-button-icon>
    </div>
    <div id="search-input-wrap">
        <mdui-text-field id="search-input" label="在书中查找" variant="outlined" clearable></mdui-text-field>
        <div class="search-status" id="search-status"></div>
    </div>
    <div class="panel-body" id="search-results"></div>
</aside>

<aside id="notes-panel" class="side-panel" data-side="end" aria-label="高亮与笔记" hidden>
    <div class="panel-head">
        <h2>高亮与笔记</h2>
        <mdui-button-icon icon="close" id="notes-close" aria-label="关闭笔记"></mdui-button-icon>
    </div>
    <div class="panel-body" id="notes-list"></div>
</aside>

<div id="sel-bar" class="sel-bar" hidden role="toolbar" aria-label="高亮工具">
    <button type="button" class="sel-dot" data-hl="yellow" style="--dot:#d6a900" aria-label="黄色高亮"></button>
    <button type="button" class="sel-dot" data-hl="green" style="--dot:#39875b" aria-label="绿色高亮"></button>
    <button type="button" class="sel-dot" data-hl="blue" style="--dot:#3678c8" aria-label="蓝色高亮"></button>
    <button type="button" class="sel-dot" data-hl="orange" style="--dot:#c46a19" aria-label="橙色高亮"></button>
    <button type="button" class="sel-dot" data-hl="red" style="--dot:#c43c39" aria-label="红色高亮"></button>
    <button type="button" class="sel-action" data-hl="underline" aria-label="下划线">U</button>
    <button type="button" class="sel-action" data-hl="note" aria-label="写笔记">
        <mdui-icon name="edit_note"></mdui-icon>
    </button>
</div>

<mdui-dialog id="note-dialog" headline="笔记">
    <div id="note-quote" class="note-quote"></div>
    <mdui-text-field id="note-text" label="写下想法" rows="4" variant="outlined"></mdui-text-field>
    <mdui-button slot="action" variant="text" id="note-delete">删除</mdui-button>
    <mdui-button slot="action" variant="text" id="note-cancel">取消</mdui-button>
    <mdui-button slot="action" variant="filled" id="note-save">保存</mdui-button>
</mdui-dialog>

<header id="chrome-top" class="chrome-bar" aria-label="阅读工具栏">
    <div class="cluster cluster-start">
        <mdui-button-icon icon="arrow_back" id="btn-back" aria-label="返回"></mdui-button-icon>
        <mdui-button-icon icon="toc" id="btn-toc" aria-label="目录"></mdui-button-icon>
    </div>
    <p class="chrome-title" id="chrome-title"></p>
    <div class="cluster cluster-end">
        <mdui-button-icon icon="search" id="btn-search" aria-label="搜索"></mdui-button-icon>
        <mdui-button-icon icon="sticky_note_2" id="btn-notes" aria-label="高亮与笔记"></mdui-button-icon>
        <mdui-button-icon icon="text_fields" id="btn-settings" aria-label="阅读设置"></mdui-button-icon>
        <mdui-button-icon icon="fullscreen" id="btn-fullscreen" aria-label="全屏" class="max-sm-hide"></mdui-button-icon>
    </div>
</header>

<footer id="chrome-bottom" class="chrome-bar" aria-label="翻页与进度">
    <mdui-button-icon icon="first_page" id="btn-first" aria-label="开头"></mdui-button-icon>
    <mdui-button-icon icon="chevron_left" id="btn-prev-chapter" aria-label="上一章"></mdui-button-icon>
    <mdui-slider id="progress-slider" min="0" max="1" step="0.001" value="0" disabled aria-label="阅读进度"></mdui-slider>
    <mdui-button-icon icon="chevron_right" id="btn-next-chapter" aria-label="下一章"></mdui-button-icon>
    <mdui-button-icon icon="last_page" id="btn-last" aria-label="结尾"></mdui-button-icon>
</footer>

<script src="reader.js" type="module"></script>
</body>
</html>
