services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./src:/app
    restart: unless-stopped

  nginx:
    image: nginx:1.30-alpine
    ports:
      - "9528:80"
    volumes:
      - ./src:/app:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped