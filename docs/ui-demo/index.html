<!doctype html>
<html lang="zh-CN" class="mdui-theme-auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>月读 · UI Demo</title>
  <!-- 直接吃项目 framework，保证和线上同一套 MDUI / Material You -->
  <link rel="stylesheet" href="../../src/app/static/framework/icons/fonts.css" />
  <link rel="stylesheet" href="../../src/app/static/framework/libs/mdui.css" />
  <link rel="stylesheet" href="../../src/app/static/framework/base.css" />
  <link rel="stylesheet" href="../../src/app/static/framework/motion.css" />
  <link rel="stylesheet" href="../../src/app/static/framework/layout.css" />
  <script src="../../src/app/static/framework/libs/vhcheck.min.js"></script>
  <script src="../../src/app/static/framework/libs/mdui.global.min.js"></script>
  <style>
    /* ---- 本 demo 提议的业务层美化（未进正式 tpl） ---- */
    :root {
      --demo-cover-radius: 12px;
      --demo-card-pad: 1.25rem;
    }

    .nova-app-bar-surface {
      background: rgba(var(--mdui-color-surface), 0.92);
      backdrop-filter: blur(12px);
    }

    /* 顶栏品牌：Logo + 月读，版本号在标题正下方 */
    .app-bar-brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
      margin-left: 0.15rem;
      line-height: 1.15;
    }
    .app-bar-brand .brand-mark {
      width: 36px;
      height: 36px;
      font-size: 1rem;
    }
    .app-bar-brand .brand-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .app-bar-brand .brand-title {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
      line-height: 1.2;
    }
    .app-bar-brand .brand-version {
      margin-top: 0.1rem;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: rgb(var(--mdui-color-on-surface-variant));
      opacity: 0.9;
    }

    .demo-ribbon {
      position: fixed;
      z-index: 120;
      right: 12px;
      bottom: 12px;
      max-width: min(320px, calc(100vw - 24px));
      padding: 10px 14px;
      border-radius: 16px;
      background: rgb(var(--mdui-color-tertiary-container));
      color: rgb(var(--mdui-color-on-tertiary-container));
      font-size: 12px;
      line-height: 1.45;
      box-shadow: var(--mdui-elevation-level2);
    }

    /* 继续阅读：主卡用 primary-container 语气，而不是普通 filled 灰块 */
    .continue-hero {
      display: flex;
      gap: 1.25rem;
      padding: var(--demo-card-pad);
      border-radius: 28px;
      background: rgb(var(--mdui-color-primary-container));
      color: rgb(var(--mdui-color-on-primary-container));
    }
    .continue-hero .cover {
      width: 132px;
      min-width: 132px;
      aspect-ratio: 3/4;
      border-radius: var(--demo-cover-radius);
      overflow: hidden;
      background: rgba(var(--mdui-color-on-primary-container), 0.12);
      box-shadow: var(--mdui-elevation-level2);
    }
    .continue-hero .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .continue-hero .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .continue-hero .progress-track {
      height: 8px; border-radius: 99px;
      background: rgba(var(--mdui-color-on-primary-container), 0.18);
      overflow: hidden;
    }
    .continue-hero .progress-bar {
      height: 100%; border-radius: 99px;
      background: rgb(var(--mdui-color-primary));
    }
    @media (max-width: 640px) {
      .continue-hero { flex-direction: column; }
      .continue-hero .cover { width: 100%; min-width: 0; max-height: 280px; }
      .continue-hero mdui-button { width: 100%; }
    }

    /* 最近阅读 / 书库封面 */
    .cover-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
      gap: 14px;
    }
    .cover-card {
      border: 0;
      padding: 0;
      background: transparent;
      text-align: left;
      cursor: pointer;
      color: inherit;
    }
    .cover-card .thumb {
      aspect-ratio: 3/4;
      border-radius: var(--demo-cover-radius);
      overflow: hidden;
      background: rgb(var(--mdui-color-surface-container-high));
      transition: transform var(--nova-motion-duration-short4, 200ms) var(--nova-motion-easing-standard, ease);
    }
    .cover-card:hover .thumb,
    .cover-card:focus-visible .thumb {
      transform: translateY(-4px);
    }
    .cover-card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cover-card .name {
      margin-top: 8px;
      font-size: 0.82rem;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .cover-card .author {
      margin-top: 2px;
      font-size: 0.72rem;
      color: rgb(var(--mdui-color-on-surface-variant));
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 最近阅读横滑 */
    .recent-row {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(200px, 1fr);
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
      scroll-snap-type: x mandatory;
    }
    .recent-item {
      scroll-snap-align: start;
      display: flex;
      gap: 12px;
      padding: 12px;
      border-radius: 20px;
      background: rgb(var(--mdui-color-surface-container-low));
      min-height: 96px;
    }
    .recent-item .thumb {
      width: 56px; min-width: 56px; height: 80px;
      border-radius: 8px; overflow: hidden;
      background: rgb(var(--mdui-color-surface-container-high));
    }
    .recent-item .thumb img { width: 100%; height: 100%; object-fit: cover; }

    /* 笔记卡 */
    .note-list { display: grid; gap: 12px; }
    .note-card {
      padding: 16px 18px;
      border-radius: 20px;
      background: rgb(var(--mdui-color-surface-container-low));
    }
    .note-card blockquote {
      margin: 8px 0 0;
      padding-left: 12px;
      border-left: 3px solid rgb(var(--mdui-color-primary));
      color: rgb(var(--mdui-color-on-surface-variant));
      font-size: 0.92rem;
      line-height: 1.55;
    }

    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
  </style>
</head>
<body class="bg">

<mdui-layout>
  <mdui-top-app-bar scroll-behavior="elevate" scroll-target=".layout-main" class="position-fixed nova-app-bar-surface">
    <mdui-button-icon icon="menu" id="navigation-drawer-switch"></mdui-button-icon>
    <div class="app-bar-brand">
      <div class="brand-mark" aria-hidden="true">月</div>
      <div class="brand-text">
        <span class="brand-title">月读</span>
        <span class="brand-version">v1.2.1</span>
      </div>
    </div>
    <div style="flex-grow:1"></div>
    <div class="layout-header-right d-flex items-center gap-2">
      <theme-switcher iconBtn="true"></theme-switcher>
      <mdui-dropdown class="layout-header-user-info">
        <span slot="trigger" class="p-0">
          <mdui-avatar icon="account_circle"></mdui-avatar>
          <span>Demo</span>
        </span>
        <mdui-menu>
          <mdui-menu-item disabled>仅 UI 预览 · 无后端</mdui-menu-item>
        </mdui-menu>
      </mdui-dropdown>
    </div>
  </mdui-top-app-bar>

  <mdui-navigation-drawer open class="navigation-drawer position-fixed" id="navigation-drawer" close-on-overlay-click>
    <mdui-list class="m-2">
      <mdui-list-item rounded icon="dashboard" data-page="reading" active>继续阅读</mdui-list-item>
      <mdui-list-item rounded icon="format_quote" data-page="notes">笔记与高亮</mdui-list-item>
      <mdui-list-item rounded icon="analytics" data-page="stats">统计</mdui-list-item>
      <mdui-collapse>
        <mdui-collapse-item value="library">
          <mdui-list-item slot="header" rounded icon="library_books">
            <span>书库管理</span>
            <mdui-icon slot="end-icon" name="keyboard_arrow_left"></mdui-icon>
          </mdui-list-item>
          <div style="margin-left: 2.5rem">
            <mdui-list-item rounded icon="menu_book" data-page="library">全部书籍</mdui-list-item>
            <mdui-list-item rounded icon="category" data-page="library">分类</mdui-list-item>
          </div>
        </mdui-collapse-item>
      </mdui-collapse>
      <mdui-list-item rounded icon="tune" data-page="calibre">书库与 Calibre</mdui-list-item>
      <mdui-collapse>
        <mdui-collapse-item value="system">
          <mdui-list-item slot="header" rounded icon="settings">
            <span>系统</span>
            <mdui-icon slot="end-icon" name="keyboard_arrow_left"></mdui-icon>
          </mdui-list-item>
          <div style="margin-left: 2.5rem">
            <mdui-list-item rounded icon="smart_toy">AI 管理</mdui-list-item>
            <mdui-list-item rounded icon="cloud_sync">WebDAV</mdui-list-item>
          </div>
        </mdui-collapse-item>
      </mdui-collapse>
    </mdui-list>
  </mdui-navigation-drawer>

  <mdui-layout-main class="layout-main">
    <div id="bodyContainer">
      <div id="container" class="container mt-0 py-3"></div>
    </div>
  </mdui-layout-main>
</mdui-layout>

<div class="demo-ribbon">
  静态预览 · 顶栏只有「月读」+ 下方版本号 · 点调色板切主题。<br />
  默认色源墨青 <code>#1F6B5C</code>（可被主题面板覆盖）。
</div>

<script>
  // file:// 下 ThemeSwitcher 依赖 $ / $.loader / $.emitter，给最小桩
  window.$ = window.mdui && mdui.$ ? mdui.$ : (window.$ || function () {});
  $.emitter = $.emitter || {
    _m: {},
    on(e, fn) { (this._m[e] = this._m[e] || []).push(fn); },
    emit(e, d) { (this._m[e] || []).forEach((fn) => fn(d)); },
    off() { this._m = {}; },
  };
  $.loader = $.loader || function (_path, cb) { if (typeof cb === "function") cb(); };
  // 未选过色源时用阅读向默认色；已选则交给 ThemeSwitcher 读 localStorage
  if (!localStorage.getItem("color")) {
    localStorage.setItem("color", "#1F6B5C");
  }
</script>
<script src="../../src/app/static/framework/theme/materialColors.js"></script>
<script src="../../src/app/static/framework/theme/ThemeSwitcher.js"></script>
<script>
  const covers = [
    { title: "悉达多", author: "赫尔曼·黑塞", tone: "2a4a3c" },
    { title: "人间失格", author: "太宰治", tone: "3d2f45" },
    { title: "月亮与六便士", author: "毛姆", tone: "4a3b28" },
    { title: "局外人", author: "加缪", tone: "2f3d4a" },
    { title: "不能承受的生命之轻", author: "昆德拉", tone: "45322f" },
    { title: "百年孤独", author: "马尔克斯", tone: "2d4538" },
  ];

  function coverSvg(title, tone) {
    const t = encodeURIComponent(title.slice(0, 4));
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='300' height='400'>
      <defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
        <stop offset='0%' stop-color='%23${tone}'/>
        <stop offset='100%' stop-color='%23121814'/>
      </linearGradient></defs>
      <rect width='300' height='400' fill='url(%23g)'/>
      <text x='24' y='340' fill='rgba(255,255,255,0.88)' font-size='28' font-family='system-ui,sans-serif'>${t}</text>
    </svg>`;
    return "data:image/svg+xml," + svg.replace(/\n\s*/g, "");
  }

  const pages = {
    reading: {
      title: "继续阅读",
      html: () => `
        <div class="nova-page-enter">
          <div class="page-head">
            <div>
              <div class="headline-small">继续阅读</div>
              <div class="body-medium text-on-surface-variant mt-1">从上次停下的地方接着看</div>
            </div>
          </div>
          <div class="continue-hero nova-rise mb-4">
            <div class="cover"><img alt="" src="${coverSvg("悉达多", "2a4a3c")}" /></div>
            <div class="meta">
              <div class="headline-small text-ellipsis">悉达多</div>
              <div class="body-medium mt-1" style="opacity:.82">赫尔曼·黑塞</div>
              <div class="label-medium mt-3" style="opacity:.75">阅读进度 62%</div>
              <div class="progress-track mt-2"><div class="progress-bar" style="width:62%"></div></div>
              <div class="mt-auto pt-3">
                <mdui-button variant="filled" icon="menu_book" class="rounded-full">继续阅读</mdui-button>
              </div>
            </div>
          </div>
          <div class="title-medium mb-2">最近阅读</div>
          <div class="recent-row nova-stagger">
            ${covers.slice(1, 5).map((b) => `
              <div class="recent-item nova-lift">
                <div class="thumb"><img alt="" src="${coverSvg(b.title, b.tone)}" /></div>
                <div class="min-w-0">
                  <div class="title-small text-ellipsis">${b.title}</div>
                  <div class="body-small text-on-surface-variant mt-1">${b.author}</div>
                  <div class="label-small text-on-surface-variant mt-2">昨天 · 第 12 章</div>
                </div>
              </div>`).join("")}
          </div>
        </div>`,
    },
    library: {
      title: "全部书籍",
      html: () => `
        <div class="nova-page-enter">
          <div class="page-head">
            <div>
              <div class="headline-small">书库</div>
              <div class="body-medium text-on-surface-variant mt-1">${covers.length} 本 · 封面网格</div>
            </div>
            <div class="d-flex gap-2">
              <mdui-button-icon icon="search"></mdui-button-icon>
              <mdui-button variant="tonal" icon="upload">导入</mdui-button>
            </div>
          </div>
          <div class="cover-grid nova-stagger">
            ${covers.map((b) => `
              <button type="button" class="cover-card">
                <div class="thumb"><img alt="" src="${coverSvg(b.title, b.tone)}" /></div>
                <div class="name">${b.title}</div>
                <div class="author">${b.author}</div>
              </button>`).join("")}
          </div>
        </div>`,
    },
    notes: {
      title: "笔记与高亮",
      html: () => `
        <div class="nova-page-enter">
          <div class="page-head">
            <div>
              <div class="headline-small">笔记与高亮</div>
              <div class="body-medium text-on-surface-variant mt-1">按书聚合 · 语气留给引用本身</div>
            </div>
          </div>
          <div class="note-list nova-stagger">
            <article class="note-card">
              <div class="label-medium text-on-surface-variant">悉达多 · 第 3 章</div>
              <blockquote>他必须从自己身上找到源头，这条路无法由任何人替他走。</blockquote>
            </article>
            <article class="note-card">
              <div class="label-medium text-on-surface-variant">月亮与六便士 · 第 12 章</div>
              <blockquote>为了理想，他可以抛弃一切，包括世人眼里的成功。</blockquote>
            </article>
            <article class="note-card">
              <div class="label-medium text-on-surface-variant">局外人 · 第一部</div>
              <blockquote>今天，妈妈死了。也许是昨天，我不知道。</blockquote>
            </article>
          </div>
        </div>`,
    },
    stats: {
      title: "统计",
      html: () => `
        <div class="nova-page-enter">
          <div class="headline-small mb-3">统计</div>
          <div class="row nova-stagger">
            ${[
              ["本周阅读", "6.2 小时"],
              ["在读书籍", "4"],
              ["高亮条数", "128"],
            ].map(([k, v]) => `
              <div class="col-xs-12 col-md-4 mb-3">
                <mdui-card variant="filled" class="p-4 nova-lift">
                  <div class="label-large text-on-surface-variant">${k}</div>
                  <div class="display-small mt-2">${v}</div>
                </mdui-card>
              </div>`).join("")}
          </div>
        </div>`,
    },
    calibre: {
      title: "书库与 Calibre",
      html: () => `
        <div class="nova-page-enter" style="max-width:40rem">
          <div class="headline-small mb-2">书库与 Calibre</div>
          <p class="body-medium text-on-surface-variant mb-4">设置页保持表单密度，壳层负责气质，不在这里堆装饰。</p>
          <mdui-card variant="filled" class="p-4">
            <mdui-text-field label="Calibre Content Server" value="http://127.0.0.1:8080" class="mb-3"></mdui-text-field>
            <mdui-checkbox checked>上传后自动刮削元数据</mdui-checkbox>
            <div class="mt-3">
              <mdui-button icon="save">保存</mdui-button>
            </div>
          </mdui-card>
        </div>`,
    },
  };

  const box = document.getElementById("container");
  const drawer = document.getElementById("navigation-drawer");
  const drawerBtn = document.getElementById("navigation-drawer-switch");

  function show(key) {
    const page = pages[key] || pages.reading;
    box.classList.remove("nova-page-enter");
    void box.offsetWidth;
    box.innerHTML = page.html();
    document.title = page.title + " · 月读 UI Demo";
    document.querySelectorAll("mdui-list-item[data-page]").forEach((el) => {
      if (el.getAttribute("data-page") === key) el.setAttribute("active", "");
      else el.removeAttribute("active");
    });
  }

  document.querySelector("#navigation-drawer mdui-list").addEventListener("click", (e) => {
    const item = e.target.closest("mdui-list-item[data-page]");
    if (!item) return;
    show(item.getAttribute("data-page"));
  });

  if (drawerBtn && drawer) {
    drawerBtn.addEventListener("click", () => {
      if (typeof drawer.open === "boolean") drawer.open = !drawer.open;
      else drawer.toggleAttribute("open");
    });
  }

  show("reading");
</script>
</body>
</html>
