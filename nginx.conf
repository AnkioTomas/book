server {
    listen 80;
    server_name _;

    root /app/public;
    index index.php;
    client_max_body_size 512m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param HTTP_PROXY "";
    }

    location ~ \.php$ {
        return 404;
    }
}